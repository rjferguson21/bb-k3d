# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  BIGBANG_BASE: /home/rob/bb/bigbang
  BIGBANG_K3D_CHART: '{{.ROOT_DIR}}/../chart'
  LOCAL_TMP: "{{.USER_WORKING_DIR}}/dev"
  PACKAGE:
    sh: basename -s .git "$(git -C {{.USER_WORKING_DIR}} remote get-url origin 2>/dev/null)" 2>/dev/null || echo "keycloak"
  PACKAGE_PATH:
    sh: |
      # Reverse lookup: find the values.yaml path by matching git.repo URL to origin remote
      origin_url=$(git -C {{.USER_WORKING_DIR}} remote get-url origin 2>/dev/null)
      if [ -n "$origin_url" ]; then
        # Normalize: remove .git suffix and trailing slashes for comparison
        origin_normalized=$(echo "$origin_url" | sed 's/\.git$//' | sed 's:/$::')
        # Find path where git.repo matches (also normalized)
        result=$(yq e '.. | select(has("git")) | select(.git.repo) | {"path": (path | join(".")), "repo": .git.repo}' {{.BIGBANG_BASE}}/chart/values.yaml | \
          awk -v origin="$origin_normalized" '
            /^path:/ { path = $2 }
            /^repo:/ {
              repo = $2
              gsub(/\.git$/, "", repo)
              gsub(/\/$/, "", repo)
              if (repo == origin) { print path; exit }
            }
          ')
        if [ -n "$result" ]; then
          echo "$result"
          exit 0
        fi
      fi
      # Fallback: match by package name (kebab-case to camelCase)
      camel=$(echo "{{.PACKAGE}}" | sed -E 's/-([a-z])/\U\1/g')
      yq e ".. | (select(has(\"git\")) or (select(has(\"helmRepo\")))) | (path | join(\".\")) | select(test(\"(?i)({{.PACKAGE}}|$camel)$\"))" {{.BIGBANG_BASE}}/chart/values.yaml | head -1
  PACKAGE_NAMESPACE:
    sh: |
      # Try HelmRelease targetNamespace first, then values.yaml, then fall back to package name
      ns=$(grep -h "targetNamespace:" {{.BIGBANG_BASE}}/chart/templates/{{.PACKAGE}}/helmrelease.yaml 2>/dev/null | head -1 | awk '{print $2}')
      if [ -z "$ns" ] || echo "$ns" | grep -qF '{{ "{{" }}'; then
        pkg_path="{{.PACKAGE_PATH}}"
        if [ -n "$pkg_path" ]; then
          ns=$(yq e ".$pkg_path.namespace // \"\"" {{.BIGBANG_BASE}}/chart/values.yaml)
        fi
      fi
      echo "${ns:-{{.PACKAGE}}}"

includes:
  aws:
    taskfile: ./taskfiles/aws.yml
  util:
    taskfile: ./taskfiles/util.yml
  router:
    taskfile: ./taskfiles/router.yml
  base:
    taskfile: ./taskfiles/base.yml
    flatten: true

tasks:
  default:
    desc: "Create a branch-named k3d cluster, deploy BigBang from BIGBANG_DIR, and point the SNI router at it. CLUSTER_NAME defaults to the umbrella branch; override to run several side by side. Use EXTRA_ARGS for extra values."
    vars:
      BIGBANG_DIR: '{{.BIGBANG_DIR | default .BIGBANG_BASE}}'
      BRANCH_NAME:
        sh: |
          ref=$(git -C "{{.BIGBANG_DIR}}" rev-parse --abbrev-ref HEAD 2>/dev/null)
          [ "$ref" = HEAD ] && ref=$(git -C "{{.BIGBANG_DIR}}" rev-parse --short HEAD 2>/dev/null)
          echo "${ref:-bigbang}" | tr '[:upper:]/_' '[:lower:]--' | sed 's/[^a-z0-9-]//g' | cut -c1-30 | sed 's/^-*//; s/-*$//'
      CLUSTER_NAME: '{{.CLUSTER_NAME | default .BRANCH_NAME}}'
    cmds:
      - task: k3d-create
        vars: { CLUSTER_NAME: "{{.CLUSTER_NAME}}" }
      - task: external-dependencies
        vars: { CLUSTER_NAME: "{{.CLUSTER_NAME}}", BIGBANG_DIR: "{{.BIGBANG_DIR}}" }
      - task: deploy
        vars: { DISABLE_CORE: "{{.DISABLE_CORE}}", BIGBANG_DIR: "{{.BIGBANG_DIR}}" }
      - task: router:default
        vars: { CLUSTER_NAME: "{{.CLUSTER_NAME}}" }

  # Package Tasks
  package:default:
    desc: Create a k3d cluster and deploy a BigBang package. Cluster is named after the package unless CLUSTER_NAME is set; set BIGBANG_DIR to deploy from a specific umbrella checkout/worktree.
    vars:
      CLUSTER_NAME: '{{.CLUSTER_NAME | default .PACKAGE}}'
    cmds:
      - task: k3d-create
        vars: { CLUSTER_NAME: "{{.CLUSTER_NAME}}" }
      - task: external-dependencies
        vars: { CLUSTER_NAME: "{{.CLUSTER_NAME}}", BIGBANG_DIR: "{{.BIGBANG_DIR}}" }
      - task: package:deploy
      - task: package:test

  package:deploy:
    desc: Deploy BigBang with the current package branch from CWD. Use TEST_VALUES to swap the test values file (e.g. TEST_VALUES=tests/test-sso-values.yaml); set BIGBANG_DIR to deploy from a specific umbrella checkout/worktree.
    dir: '{{.USER_WORKING_DIR}}'
    vars:
      TEST_VALUES: '{{.TEST_VALUES | default "tests/test-values.yaml"}}'
    cmds:
      - task: deploy
        vars:
          DISABLE_CORE: "{{.DISABLE_CORE}}"
          BIGBANG_DIR: "{{.BIGBANG_DIR}}"
          EXTRA_ARGS: -f {{.TEST_VALUES}} --set={{.PACKAGE_PATH}}.git.branch=$(git rev-parse --abbrev-ref HEAD) --set={{.PACKAGE_PATH}}.git.tag=null {{ .EXTRA_VALUES }}

  package:upgrade:
    desc: Test package upgrade from released version to current branch. Use TEST_VALUES to swap the test values file (e.g. TEST_VALUES=tests/test-sso-values.yaml); set BIGBANG_DIR to deploy from a specific umbrella checkout/worktree.
    dir: '{{.USER_WORKING_DIR}}'
    vars:
      TEST_VALUES: '{{.TEST_VALUES | default "tests/test-values.yaml"}}'
      CLUSTER_NAME: '{{.CLUSTER_NAME | default .PACKAGE}}'
    cmds:
      - task: k3d-create
        vars: { CLUSTER_NAME: "{{.CLUSTER_NAME}}" }
      - task: deploy
        vars:
          BIGBANG_DIR: "{{.BIGBANG_DIR}}"
          EXTRA_ARGS: -f {{.TEST_VALUES}}
      - task: package:deploy
      - |
        # deploy's HelmRelease wait can pass on the pre-upgrade revision before
        # flux fetches the branch; force reconciliation and wait for the upgrade
        HR=$(kubectl get helmrelease -n bigbang -o json | jq -r --arg pkg "{{.PACKAGE}}" '.items[] | select(.spec.chart.spec.chart == $pkg or .metadata.name == $pkg) | .metadata.name' | head -1)
        flux reconcile source git {{.PACKAGE}} -n bigbang
        flux reconcile helmrelease "${HR:-{{.PACKAGE}}}" -n bigbang
      - task: package:test

  package:test:unit:
    desc: Run Helm unit tests for the package
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - helm unittest -f "chart/unittests/**/*_test.yaml" chart

  package:test:e2e:
    desc: Run Helm e2e tests against the deployed package
    vars:
      # re-derived here because globals in this file don't see CLI vars
      BASE_MOUNT_DIR: '{{eq (.DOCKER_CONTEXT | default "") "bb-dev" | ternary "/home/ubuntu" .LOCAL_TMP}}'
      COMMAND_PREFIX: '{{eq (.DOCKER_CONTEXT | default "") "bb-dev" | ternary "ssh bb-dev" ""}}'
      PACKAGE:
        sh: cat chart/Chart.yaml | yq '.name'
      RELEASE_NAME:
        sh: helm list -A -o json | jq -r '[.[] | select(.chart | startswith("{{.PACKAGE}}")) | .name] | join(" ")'
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - "{{.COMMAND_PREFIX}} rm -fr {{.BASE_MOUNT_DIR}}/cypress/*"
      - for: { var: RELEASE_NAME }
        cmd: helm test {{.ITEM}} -n bigbang

  package:test:
    desc: Run all package tests (unit and e2e)
    cmds:
      - task: package:test:unit
      - task: package:test:e2e

  package:info:
    desc: Display detected package name, path, and namespace from CWD
    cmds:
      - echo "PACKAGE={{.PACKAGE}}"
      - echo "PACKAGE_PATH={{.PACKAGE_PATH}}"
      - echo "PACKAGE_NAMESPACE={{.PACKAGE_NAMESPACE}}"
      - echo "USER_WORKING_DIR={{.USER_WORKING_DIR}}"
