suite: test k3d-config template
templates:
  - k3d-config.yaml
tests:
  - it: should render k3d config with default values
    asserts:
      - matchRegex:
          path: kind
          pattern: "^Simple$"
      - equal:
          path: apiVersion
          value: k3d.io/v1alpha5
      - equal:
          path: metadata.name
          value: bb-helm
      - equal:
          path: image
          value: rancher/k3s:v1.33.3-k3s1
      - equal:
          path: agents
          value: 3
      - equal:
          path: subnet
          value: 172.28.0.0/16
      - equal:
          path: kubeAPI.hostIP
          value: 127.0.0.1
      - equal:
          path: kubeAPI.hostPort
          value: "6443"

  - it: should use custom k3d image when specified
    set:
      k3d.image: rancher/k3s:v1.30.0-k3s1
    asserts:
      - equal:
          path: image
          value: rancher/k3s:v1.30.0-k3s1

  - it: should use custom number of nodes when specified
    set:
      k3d.nodes: 5
    asserts:
      - equal:
          path: agents
          value: 5

  - it: should use custom subnet when specified
    set:
      k3d.subnet: 10.0.0.0/16
    asserts:
      - equal:
          path: subnet
          value: 10.0.0.0/16

  - it: should use custom server IP when specified
    set:
      k3d.serverIP: 192.168.1.100
    asserts:
      - equal:
          path: kubeAPI.hostIP
          value: 192.168.1.100
      - matchRegex:
          path: options.k3s.extraArgs[1].arg
          pattern: "--tls-san=192.168.1.100"

  - it: should not set kubeAPI host by default
    asserts:
      - notExists:
          path: kubeAPI.host

  - it: should set kubeAPI host and tls-san when serverHost is specified
    set:
      k3d.serverHost: "3.30.39.237"
    asserts:
      - equal:
          path: kubeAPI.host
          value: 3.30.39.237
      - matchRegex:
          path: options.k3s.extraArgs[2].arg
          pattern: "--tls-san=3.30.39.237"

  - it: should use custom cluster name when specified
    set:
      k3d.name: bb-helm-b
    asserts:
      - equal:
          path: metadata.name
          value: bb-helm-b

  - it: should use custom apiPort when specified
    set:
      k3d.apiPort: 6444
    asserts:
      - equal:
          path: kubeAPI.hostPort
          value: "6444"

  - it: should update the default kubeconfig by default
    asserts:
      - equal:
          path: options.kubeconfig.updateDefaultKubeconfig
          value: true
      - equal:
          path: options.kubeconfig.switchCurrentContext
          value: true

  - it: should leave the default kubeconfig alone when updateDefaultKubeconfig is false
    set:
      k3d.updateDefaultKubeconfig: false
    asserts:
      - equal:
          path: options.kubeconfig.updateDefaultKubeconfig
          value: false
      - equal:
          path: options.kubeconfig.switchCurrentContext
          value: false

  - it: should publish host ports 80 and 443 by default
    asserts:
      - equal:
          path: ports[0].port
          value: 80:80
      - equal:
          path: ports[1].port
          value: 443:443

  - it: should omit host ports when publishPorts is false
    set:
      k3d.publishPorts: false
    asserts:
      - notExists:
          path: ports

  - it: should create a per-cluster proxy registry by default
    asserts:
      - equal:
          path: registries.create.name
          value: repo1
      - notExists:
          path: registries.use

  - it: should use a shared external registry when registry1.shared is true
    set:
      registry1.shared: true
    asserts:
      - notExists:
          path: registries.create
      - equal:
          path: registries.use[0]
          value: k3d-repo1:5000
