# yaml-lanage-server: $schema=https://raw.githubusercontent.com/k3d-io/k3d/refs/heads/main/pkg/config/v1alpha5/schema.json
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: {{ .Values.k3d.name }}
image: {{ .Values.k3d.image }}
agents: {{ .Values.k3d.nodes }}
subnet: {{ .Values.k3d.subnet }}
kubeAPI:
  {{- with .Values.k3d.serverHost }}
  host: {{ . }}
  {{- end }}
  hostIP: {{ .Values.k3d.serverIP }}
  hostPort: "{{ .Values.k3d.apiPort }}"
hostAliases:
  - ip: {{ .Values.k3d.hostAliases.passthrough.ip }}
    hostnames: {{ toYaml .Values.k3d.hostAliases.passthrough.hostnames | nindent 6 }}
  - ip: {{ .Values.k3d.hostAliases.public.ip }}
    hostnames: {{ toYaml .Values.k3d.hostAliases.public.hostnames | nindent 6 }}
volumes:
  - volume: /etc/machine-id:/etc/machine-id
    nodeFilters:
      - server:0
      - agent:*
  - volume: {{ .Values.k3d.volumeBaseDir }}/cypress:/cypress
    nodeFilters:
      - server:0
      - agent:*
{{- if .Values.k3d.publishPorts }}
ports:
  - port: 80:80
    nodeFilters:
      - server:*
  - port: 443:443
    nodeFilters:
      - server:*
{{- end }}
options:
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
  k3s:
    extraArgs:
      {{- if not .Values.k3d.metricsServer }}
      - arg: --disable=metrics-server
        nodeFilters:
          - server:*
      {{- end }}
      - arg: --tls-san={{ .Values.k3d.serverIP }}
        nodeFilters:
          - server:*
      {{- with .Values.k3d.serverHost }}
      - arg: --tls-san={{ . }}
        nodeFilters:
          - server:*
      {{- end }}
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      - arg: --disable=servicelb
        nodeFilters:
          - server:*
registries:
  {{- if .Values.registry1.shared }}
  use:
    - k3d-{{ .Values.registry1.proxyName }}:5000
  {{- else }}
  create:
    name: {{ .Values.registry1.proxyName }}
    proxy:
      remoteURL: https://{{ .Values.registry1.registry }}
      {{- if .Values.registry1.username }}
      username: {{ .Values.registry1.username }}
      {{- end }}
      {{- if .Values.registry1.password }}
      password: {{ .Values.registry1.password }}
      {{- end }}
    volumes:
      - {{ .Values.k3d.volumeBaseDir }}/reg:/var/lib/registry
  {{- end }}
  config: |
    mirrors:
      "{{ .Values.registry1.registry }}":
        endpoint:
          - http://{{ if .Values.registry1.shared }}k3d-{{ end }}{{ .Values.registry1.proxyName }}:5000
    {{- if and .Values.registry1.username .Values.registry1.password }}
    configs:
      {{ .Values.registry1.registry }}:
        auth:
          username: {{ .Values.registry1.username }}
          password: {{ .Values.registry1.password }}
    {{- end }}
files:
  - description: 'Bootstrap'
    source: bootstrap.yaml
    destination: /var/lib/rancher/k3s/server/manifests/bootstrap.yaml
