k3d:
  name: "bb-helm"

  nodes: 3

  image: "rancher/k3s:v1.33.3-k3s1"

  # Set to true to enable the built-in k3s metrics-server
  metricsServer: false

  serverIP: "127.0.0.1"

  # Host port for the Kubernetes API server. Change per cluster to run several on one host.
  apiPort: 6443

  # Publish host ports 80/443. Disable on secondary clusters since the first one owns them.
  publishPorts: true

  # Hostname/IP written into the kubeconfig server URL and added as a TLS SAN.
  # Set this when the docker host is remote (e.g. an EC2 public IP) and
  # serverIP is a bind address like 0.0.0.0.
  serverHost: ""

  subnet: "172.28.0.0/16"

  metallb:
    # Address pool for MetalLB; must fall within subnet and cover the hostAliases IPs.
    addresses: "172.28.0.2-172.28.0.5"

  hostAliases:
    passthrough:
      ip: "172.28.0.4"
      hostnames:
        - keycloak.dev.bigbang.mil
        - vault.dev.bigbang.mil
    public:
      ip: "172.28.0.3"
      hostnames:
        - gitlab.dev.bigbang.mil
        - registry.dev.bigbang.mil
        - kiali.dev.bigbang.mil
        - argocd.dev.bigbang.mil
        - prometheus.dev.bigbang.mil
        - alertmanager.dev.bigbang.mil
        - thanos.dev.bigbang.mil
        - minio.dev.bigbang.mil
        - minio-api.dev.bigbang.mil
        - loki.dev.bigbang.mil
        - grafana.dev.bigbang.mil
        - twistlock.dev.bigbang.mil
        - sonarqube.dev.bigbang.mil
        - neuvector.dev.bigbang.mil
        - kibana.dev.bigbang.mil
        - harbor.dev.bigbang.mil
        - backstage.dev.bigbang.mil
        - backstage.dev.bigbang.mil
        - chat.dev.bigbang.mil
        - fortify.dev.bigbang.mil

  volumeBaseDir: "/home/rob"

nginx:
  enabled: false

registry1:
  registry: "registry1.dso.mil"
  username: "rob.ferguson"
  email: "rferguson@bridgephase.com"
  password: ""

  # Container name of the pull-through proxy registry.
  proxyName: "repo1"

  # Reuse one external registry (created once via `k3d registry create`) across clusters
  # instead of creating a per-cluster one. Enable on multi-cluster hosts to share the cache.
  shared: false

flux:
  image:
    repository: registry1.dso.mil/ironbank/fluxcd
    tag: v1.2.0

  helmController:
    image: registry1.dso.mil/ironbank/fluxcd/helm-controller
    tag: v1.6.3
    container:
      additionalArgs:
        - "--requeue-dependency=10s"
    resources:
      limits:
        cpu: 1800m
        memory: 2Gi
      requests:
        cpu: 900m
        memory: 1Gi
    serviceAccount:
      automountServiceAccountToken: false
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    containerSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      privileged: false
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL

  kustomizeController:
    image: registry1.dso.mil/ironbank/fluxcd/kustomize-controller
    tag: v1.9.4
    resources:
      limits:
        cpu: 600m
        memory: 1200Mi
      requests:
        cpu: 300m
        memory: 600Mi
    serviceAccount:
      automountServiceAccountToken: false
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    containerSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      privileged: false
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL

  notificationController:
    image: registry1.dso.mil/ironbank/fluxcd/notification-controller
    tag: v1.9.3
    resources:
      limits:
        cpu: 200m
        memory: 400Mi
      requests:
        cpu: 100m
        memory: 200Mi
    serviceAccount:
      automountServiceAccountToken: false
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    containerSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      privileged: false
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL

  sourceController:
    image: registry1.dso.mil/ironbank/fluxcd/source-controller
    tag: v1.9.4
    resources:
      limits:
        cpu: 600m
        memory: 800Mi
      requests:
        cpu: 300m
        memory: 384Mi
    serviceAccount:
      automountServiceAccountToken: false
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    containerSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      privileged: false
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL

  # Common configurations for all controllers
  commonLabels:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "true"

  imagePullSecrets:
    - name: private-registry

  terminationGracePeriodSeconds: 60
    
