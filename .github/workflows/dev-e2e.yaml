name: Dev Taskfile E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dev-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TASKFILE: ${{ github.workspace }}/dev/Taskfile.yml

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Install Task
        uses: go-task/setup-task@v1
        with:
          version: 3.x

      - name: Install Helm
        uses: azure/setup-helm@v4

      # Stand-in for a Big Bang clone; the dev Taskfile only reads its values.yaml for package lookups
      - name: Prepare working directory
        run: |
          BIGBANG_BASE=$RUNNER_TEMP/bigbang
          WORKDIR=$RUNNER_TEMP/work
          printf 'BIGBANG_BASE=%s\nWORKDIR=%s\nDEV_KUBECONFIG=%s\n' "$BIGBANG_BASE" "$WORKDIR" "$WORKDIR/dev/kubeconfig" >> "$GITHUB_ENV"
          mkdir -p "$BIGBANG_BASE/chart" "$WORKDIR" ~/.kube
          echo '{}' > "$BIGBANG_BASE/chart/values.yaml"
          printf 'apiVersion: v1\nkind: Config\ncurrent-context: sentinel\ncontexts: []\nclusters: []\nusers: []\n' > ~/.kube/config
          sha256sum ~/.kube/config > "$RUNNER_TEMP/kubeconfig.sha256"

      - name: Create cluster with k3d-create
        run: cd "$WORKDIR" && task -t "$TASKFILE" k3d-create USE_PUBLIC_IMAGES=true

      - name: Render the other tasks (dry run)
        run: |
          cd "$WORKDIR"
          for t in default package:default package:upgrade router:default; do
            echo "::group::$t"
            task -t "$TASKFILE" --dry "$t" USE_PUBLIC_IMAGES=true
            echo "::endgroup::"
          done

      - name: Kubeconfig is isolated to the working directory
        run: |
          test -f "$DEV_KUBECONFIG"
          test "$(stat -c %a "$DEV_KUBECONFIG")" = 600
          sha256sum -c "$RUNNER_TEMP/kubeconfig.sha256"
          kubectl --kubeconfig "$DEV_KUBECONFIG" wait --for=condition=Ready nodes --all --timeout=300s
          test "$(kubectl --kubeconfig "$DEV_KUBECONFIG" get nodes --no-headers | wc -l)" = 4

      - name: Shared registry uses the cache volume and is attached to the cluster
        run: |
          docker inspect -f '{{range .Mounts}}{{.Name}} {{end}}' k3d-repo1 | grep -qw k3d-repo1-cache
          docker network inspect k3d-bb-helm -f '{{range .Containers}}{{.Name}} {{end}}' | grep -qw k3d-repo1
          cd "$WORKDIR" && task -t "$TASKFILE" --status shared-registry

      - name: Flux controllers are available
        run: |
          kubectl --kubeconfig "$DEV_KUBECONFIG" wait deploy/source-controller deploy/helm-controller \
            deploy/kustomize-controller deploy/notification-controller --for=condition=Available --timeout=300s

      - name: MetalLB assigns a LoadBalancer IP from the pool
        run: |
          export KUBECONFIG="$DEV_KUBECONFIG"
          until kubectl get ipaddresspool -n metallb-system -o name 2>/dev/null | grep -q .; do sleep 5; done
          kubectl wait -n metallb-system deploy/controller --for=condition=Available --timeout=300s
          kubectl create service loadbalancer lb-check --tcp=80:80
          ip=""
          for _ in $(seq 60); do
            ip=$(kubectl get svc lb-check -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            [ -n "$ip" ] && break
            sleep 5
          done
          echo "lb-check got $ip"
          case "$ip" in 172.28.0.[2-5]) ;; *) exit 1 ;; esac

      - name: Recreating the cluster reuses the shared registry
        run: |
          cd "$WORKDIR" && task -t "$TASKFILE" k3d-create USE_PUBLIC_IMAGES=true
          test "$(docker ps -q --filter name=^k3d-repo1$ | wc -l)" = 1
          docker network inspect k3d-bb-helm -f '{{range .Containers}}{{.Name}} {{end}}' | grep -qw k3d-repo1
          kubectl --kubeconfig "$DEV_KUBECONFIG" wait --for=condition=Ready nodes --all --timeout=300s
          sha256sum -c "$RUNNER_TEMP/kubeconfig.sha256"

      - name: Cluster state
        if: always()
        run: |
          export KUBECONFIG="$DEV_KUBECONFIG"
          kubectl get nodes -o wide || true
          kubectl get pods -A || true
          kubectl get svc -A || true
          docker ps || true

      - name: Cleanup
        if: always()
        run: |
          k3d cluster delete bb-helm || true
          k3d registry delete k3d-repo1 || true
