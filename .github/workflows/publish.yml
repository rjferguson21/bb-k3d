name: Publish Helm Chart to GHCR

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Install yq
        run: |
          sudo wget -O /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.43.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Log in to GHCR
        run: echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Check chart version
        run: |
          CHART_VERSION=$(yq '.version' chart/Chart.yaml)
          CHART_NAME=$(yq '.name' chart/Chart.yaml)
          if [ "$CHART_VERSION" != "${{ inputs.version }}" ]; then
            echo "::error::Chart.yaml version $CHART_VERSION does not match release ${{ inputs.version }}"
            exit 1
          fi
          if helm show chart oci://ghcr.io/${{ github.repository_owner }}/$CHART_NAME --version "$CHART_VERSION" >/dev/null 2>&1; then
            echo "::error::$CHART_NAME $CHART_VERSION is already published"
            exit 1
          fi

      - name: Package chart
        run: |
          helm dependency update chart
          helm package chart --destination packaged

      - name: Push chart to GHCR
        run: |
          CHART_VERSION=$(yq '.version' chart/Chart.yaml)
          CHART_NAME=$(yq '.name' chart/Chart.yaml)
          helm push packaged/${CHART_NAME}-${CHART_VERSION}.tgz oci://ghcr.io/${{ github.repository_owner }}